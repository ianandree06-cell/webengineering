<style>
  :root {
    --bg: #EEF3F3;
    --ink: #1E2B33;
    --muted: #5F6E76;
    --green: #3FA37C;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(30, 43, 51, 0.12);
    background: #EEF3F3;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; cursor: pointer;
  }
  .overlay span {
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 10px 30px rgba(30, 43, 51, 0.18);
    display: flex; align-items: center; justify-content: center;
    transition: transform .25s ease;
  }
  .overlay:hover span { transform: scale(1.06); }
  .overlay svg { margin-left: 6px; }
  .overlay[hidden] { display: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
  .bar button {
    font: 500 15px Inter, sans-serif;
    border: 0; border-radius: 999px;
    padding: 10px 18px;
    background: var(--card); color: var(--ink);
    box-shadow: 0 4px 14px rgba(30, 43, 51, 0.08);
    cursor: pointer;
  }
  .bar button.primary { background: var(--green); color: #fff; }
  .bar button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 14px; color: var(--muted); }
</style>

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = k => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function easeOutBounce(x) {
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1 / d1) return n1 * x * x;
  if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + 0.75;
  if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + 0.9375;
  return n1 * (x -= 2.625 / d1) * x + 0.984375;
}
function presence(t, s, fade = 0.9) {
  if (t < s.a || t > s.b) return 0;
  const inK = s.a === 0 ? 1 : clamp((t - s.a) / fade);

}

function M(color, extra = {}) {
  return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.55, metalness: 0, transparent: true }, extra));
}
function mesh(geo, mat, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = shadow; m.receiveShadow = shadow;
  return m;
}
function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function rbox(w, h, d, r, color, bev = 0.04) {
  const g = new THREE.ExtrudeGeometry(roundedRect(w - 2 * bev, h - 2 * bev, Math.max(0.01, r - bev)), {
    depth: Math.max(0.001, d - 2 * bev), bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 3, curveSegments: 10

  g.center();

G[4].position.set(0, -0.35, 0);
G[4].add(makeMap());
const pin4 = makePin(); pin4.position.set(-1.8, 0, 1.95); G[4].add(pin4);
const aed4 = makeAED(); aed4.scale.setScalar(0.32); aed4.position.set(1.6, 0.36, -1.95); G[4].add(aed4);
const pathCurve = new THREE.CatmullRomCurve3([
  [-1.8, 1.9], [-1.8, 1.25], [-1.76, 0.98], [-1.5, 0.9], [1.3, 0.9], [1.55, 0.86], [1.6, 0.6], [1.6, -1.55]
].map(([x, z]) => new THREE.Vector3(x, 0.09, z)), false, 'centripetal');
const TUBE_SEG = 240, TUBE_RAD = 10;
const tube = mesh(new THREE.TubeGeometry(pathCurve, TUBE_SEG, 0.07, TUBE_RAD, false), M(COL.blue, { roughness: 0.35 }), false);
G[4].add(tube);
const walker = mesh(new THREE.SphereGeometry(0.13, 24, 16), M('#FFFFFF'));
G[4].add(walker);

// 5 Wiederbelebung
G[5].position.set(2.4, 0.95, 0);
const cprHeart = makeHeart(COL.coral, 1.35); G[5].add(cprHeart);
const beatRing = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.05, 72), new THREE.MeshBasicMaterial({ color: COL.coral, transparent: true, side: THREE.DoubleSide }));
beatRing.position.z = -0.45; G[5].add(beatRing);

// 6 Outro
G[6].position.set(0, 1.0, 0);
const outHeart = makeHeart(COL.coral, 1.0); outHeart.position.set(-1.3, 0, 0);
const outAED = makeAED(); outAED.scale.setScalar(0.75); outAED.position.set(1.3, 0, 0);
G[6].add(outHeart, outAED);

// Schwebende Partikel für die ruhige Stimmung
const particles = [];
{
  const rnd = mulberry32(42), cols = [COL.coral, COL.green, COL.blue, COL.sand];
  for (let i = 0; i < 22; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.05 + rnd() * 0.09, 16, 12),
      new THREE.MeshStandardMaterial({ color: cols[i % 4], transparent: true, opacity: 0.32, roughness: 0.6 }));
    m.userData = { x: (rnd() - .5) * 18, y: rnd() * 6 - 0.4, z: -2 - rnd() * 6, sp: 0.08 + rnd() * 0.12, ph: rnd() * 6.28 };
    scene.add(m); particles.push(m);
  }

// Basis-Deckkraft merken (für Ein-/Ausblenden)
G.forEach(g => g.traverse(o => { if (o.material) o.material.userData.base = o.material.opacity; }));
function setGroupPresence(g, p, baseScale = 1) {
  g.visible = p > 0.002;
  if (!g.visible) return;
  g.traverse(o => { if (o.material) o.material.opacity = (o.material.userData.base ?? 1) * p; });
  g.scale.setScalar(baseScale * (0.82 + 0.18 * easeOut(p)));
}

// ---------- Kamera ----------
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const CAM = [
  { pos: V(0, 1.5, 10),   tgt: V(0, 0.9, 0) },
  { pos: V(0, 6.4, 8.4),  tgt: V(0, -0.3, 1.0) },
  { pos: V(0, 1.6, 10),   tgt: V(0.2, 0.55, 0) },
  { pos: V(0, 1.4, 8.8),  tgt: V(0.3, 0.55, 0) },
  { pos: V(0, 6.8, 7.8),  tgt: V(0, -0.3, 0.9) },
  { pos: V(0, 1.4, 9.2),  tgt: V(0.6, 0.45, 0) },
  { pos: V(0, 1.6, 10.5), tgt: V(0, 0.75, 0) }
];
const _tgt = new THREE.Vector3();
function updateCamera(t, clock) {
  let i = 0;
  SCENES.forEach((s, k) => { if (t >= s.a - 0.5) i = k; });
  const prev = Math.max(0, i - 1);
  const k = i === 0 ? 1 : easeInOut(clamp((t - (SCENES[i].a - 0.5)) / 1.9));
  camera.position.lerpVectors(CAM[prev].pos, CAM[i].pos, k);
  _tgt.lerpVectors(CAM[prev].tgt, CAM[i].tgt, k);
  camera.position.x += Math.sin(clock * 0.22) * 0.3;
  camera.position.y += Math.sin(clock * 0.17) * 0.08;
  camera.lookAt(_tgt);
}

// ---------- Animation pro Frame ----------
const _v = new THREE.Vector3();
function proj(obj, x, y, z) {
  _v.set(x, y, z); obj.localToWorld(_v); _v.project(camera);
  return { x: (_v.x + 1) / 2 * W, y: (1 - _v.y) / 2 * H };
}
const BEAT = 60 / 110;
function beatPulse(t) {
  const s = SCENES[5], local = t - (s.a + 0.6);
  if (local < 0 || t > s.b - 0.8) return 0;
  return Math.exp(-(local % BEAT) * 9);
}

function update(t, clock) {
  const P = SCENES.map(s => presence(t, s));

  // 0 Intro
  setGroupPresence(G[0], P[0]);
  introHeart.rotation.y = Math.sin(clock * 0.6) * 0.45;
  introHeart.position.y = Math.sin(clock * 1.1) * 0.08;

  // 1 Standort
  setGroupPresence(G[1], P[1]);
  {
    const l = t - SCENES[1].a;
    const k = clamp((l - 0.8) / 1.3);
    pin1.position.y = (1 - easeOutBounce(k)) * 3.2;
    pin1.rotation.y = clock * 0.6;
    const landed = l > 2.1;
    const f = landed ? ((l - 2.1) / 1.6) % 1 : 0;
    ring1.visible = landed && P[1] > 0;
    ring1.scale.setScalar(1 + f * 3);
    ring1.material.opacity = (1 - f) * 0.55 * P[1];
  }

  // 2 Liste
  setGroupPresence(G[2], P[2]);
  G[2].rotation.y = -0.16 + Math.sin(clock * 0.4) * 0.03;
  G[2].rotation.x = 0.03;
  cardObjs.forEach((c, i) => {
    const k = easeOut(clamp((t - SCENES[2].a - 0.6 - i * 0.35) / 1.0));
    c.position.x = (1 - k) * 7;
    c.rotation.y = (1 - k) * 0.5;
    c.userData.k = k;
    const hl = clamp((t - SCENES[2].a - 3.0) / 0.8);
    if (i === 0) {
      c.position.z = hl * 0.25;
      c.scale.setScalar(1 + hl * 0.04);
    }
  });
  {
    const hl = clamp((t - SCENES[2].a - 3.0) / 0.8);
    outline.material.opacity = hl * 0.9 * P[2];
    outline.position.z = -0.08 + hl * 0.25;
    outline.scale.setScalar(1 + hl * 0.04);
  }

  // 3 Details
  setGroupPresence(G[3], P[3]);
  {
    const k = easeOut(clamp((t - SCENES[3].a) / 1.6));
    aed3.rotation.y = lerp(-1.0, -0.28, k) + Math.sin(clock * 0.5) * 0.08;
    aed3.position.y = Math.sin(clock * 1.0) * 0.06;
  }

  // 4 Navigation
  setGroupPresence(G[4], P[4]);
  {
    const k = easeInOut(clamp((t - SCENES[4].a - 1.0) / 3.0));
    const segs = Math.floor(k * TUBE_SEG);
    tube.geometry.setDrawRange(0, segs * TUBE_RAD * 6);
    walker.visible = k > 0.001 && P[4] > 0;
    walker.position.copy(pathCurve.getPointAt(Math.max(0.001, k))).add(_v.set(0, 0.08, 0));
    pin4.rotation.y = clock * 0.5;
    aed4.rotation.y = -0.3 + Math.sin(clock * 0.8) * 0.2;
  }

  // 5 Wiederbelebung
  setGroupPresence(G[5], P[5]);
  {
    const pulse = beatPulse(t);
    cprHeart.scale.setScalar(1.35 * (1 + pulse * 0.09));
    cprHeart.rotation.y = Math.sin(clock * 0.5) * 0.3;
    const s = SCENES[5], local = t - (s.a + 0.6);
    const f = local > 0 ? (local % BEAT) / BEAT : 0;
    beatRing.visible = local > 0 && P[5] > 0 && t < s.b - 0.8;
    beatRing.scale.setScalar(1 + f * 0.9);
    beatRing.material.opacity = (1 - f) * 0.45 * P[5];
  }

  // 6 Outro
  setGroupPresence(G[6], P[6]);
  outHeart.rotation.y = Math.sin(clock * 0.6) * 0.4;
  outHeart.position.y = Math.sin(clock * 1.1) * 0.07;
  outAED.rotation.y = -0.35 + Math.sin(clock * 0.5 + 1) * 0.2;
  outAED.position.y = Math.sin(clock * 1.1 + 1.5) * 0.07;

  particles.forEach(m => {
    const d = m.userData;
    m.position.set(d.x + Math.sin(clock * 0.2 + d.ph) * 0.4, d.y + ((clock * d.sp) % 6), d.z);
    if (m.position.y > 5.6) m.position.y -= 6;
  });

  updateCamera(t, clock);
  return P;
}

// ---------- 2D-Ebene: Texte, Chips ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function chip(x, y, label, value, dot, alpha, align = 'left') {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '600 30px Inter';
  const lw = ctx.measureText(label).width;
  ctx.font = '400 30px Inter';
  const vw = value ? ctx.measureText(value).width : 0;
  const w = 26 + 18 + 14 + lw + (value ? 14 + vw : 0) + 28, h = 66;
  const x0 = align === 'left' ? x : align === 'right' ? x - w : x - w / 2;
  const y0 = y - h / 2;
  ctx.shadowColor = 'rgba(30,43,51,0.12)'; ctx.shadowBlur = 28; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#FFFFFF'; rr(x0, y0, w, h, h / 2); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(x0 + 26 + 9, y, 9, 0, Math.PI * 2); ctx.fill();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = COL.ink; ctx.font = '600 30px Inter';
  ctx.fillText(label, x0 + 26 + 18 + 14, y + 1);
  if (value) { ctx.fillStyle = COL.muted; ctx.font = '400 30px Inter'; ctx.fillText(value, x0 + 26 + 18 + 14 + lw + 14, y + 1); }
  ctx.restore();
  return { x0, w };
}

let bgGrad, scrim;
function drawBackground() {
  if (!bgGrad) {
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#E7F0F2'); bgGrad.addColorStop(1, '#F7F0EA');
    scrim = ctx.createLinearGradient(0, H - 430, 0, H);
    scrim.addColorStop(0, 'rgba(247,240,234,0)'); scrim.addColorStop(1, 'rgba(247,240,234,0.92)');
  }
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * 0.82, H * 0.12, 0, W * 0.82, H * 0.12, 700);
  g.addColorStop(0, 'rgba(233,119,107,0.10)'); g.addColorStop(1, 'rgba(233,119,107,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const g2 = ctx.createRadialGradient(W * 0.12, H * 0.2, 0, W * 0.12, H * 0.2, 650);
  g2.addColorStop(0, 'rgba(63,163,124,0.08)'); g2.addColorStop(1, 'rgba(63,163,124,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
}

function drawCaption(s, p) {
  if (p <= 0) return;
  const e = easeOut(p), dy = (1 - e) * 26;
  ctx.save();
  ctx.globalAlpha = p;
  ctx.textBaseline = 'alphabetic';
  if (s.center) {
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.ink; ctx.font = '700 92px Inter';
    ctx.fillText(s.title, W / 2, H * 0.8 + dy);
    ctx.fillStyle = COL.muted; ctx.font = '400 38px Inter';
    ctx.fillText(s.sub, W / 2, H * 0.8 + 66 + dy);
  } else {
    const x = 130, base = H - 120;
    ctx.textAlign = 'left';
    ctx.fillStyle = COL.green; ctx.font = '600 28px Inter';
    ctx.fillText(`SCHRITT ${s.step} / 5`, x, base - 140 + dy);
    ctx.fillStyle = COL.ink; ctx.font = '700 70px Inter';
    ctx.fillText(s.title, x, base - 66 + dy);
    ctx.fillStyle = COL.muted; ctx.font = '400 36px Inter';
    ctx.fillText(s.sub, x, base + dy);
  }
  ctx.restore();
}

function drawOverlay(t, P) {
  // 1: "Du bist hier"
  if (P[1] > 0) {
    const a = clamp((t - SCENES[1].a - 2.2) / 0.6) * P[1];
    const q = proj(pin1, 0, 1.45, 0);
    chip(q.x, q.y - 10 - (1 - a) * 10, 'Du bist hier', '', COL.blue, a, 'center');
  }
  // 2: Kartentexte
  if (P[2] > 0) {
    cardObjs.forEach((c, i) => {
      const a = (c.userData.k || 0) * P[2];
      if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = a; ctx.textBaseline = 'middle';
      const l = proj(c, -1.42, 0, 0.12), r = proj(c, 2.1, 0, 0.12);
      ctx.textAlign = 'left'; ctx.fillStyle = COL.ink; ctx.font = '600 34px Inter';
      ctx.fillText(CARDS[i].name, l.x, l.y);
      ctx.textAlign = 'right'; ctx.fillStyle = i === 0 ? COL.green : COL.muted; ctx.font = '600 32px Inter';
      ctx.fillText(CARDS[i].dist, r.x, r.y);
      ctx.restore();
    });
  }
  // 3: Detail-Chips mit Linien
  if (P[3] > 0) {
    const items = [
      ['Lage', 'Foyer, links neben dem Eingang', COL.blue, 0.75],
      ['Zugang', 'öffentlich', COL.green, 0],
      ['Erreichbar', 'rund um die Uhr', COL.coral, -0.75]
    ];
    items.forEach(([label, val, col, wy], i) => {
      const a = clamp((t - SCENES[3].a - 1.3 - i * 0.45) / 0.6) * P[3];
      if (a <= 0) return;
      const from = proj(aed3, 0.85, wy * 0.9, 0.3);
      const cx = from.x + 170 + (1 - easeOut(a)) * 30, cy = from.y + wy * -95;
      ctx.save(); ctx.globalAlpha = a * 0.6; ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(cx - 12, cy); ctx.stroke();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(from.x, from.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      chip(cx, cy, label, val, col, a, 'left');
    });
  }
  // 4: Route
  if (P[4] > 0) {
    const k = clamp((t - SCENES[4].a - 1.0) / 3.0);
    const a1 = clamp((k - 0.55) / 0.3) * P[4];
    const mid = pathCurve.getPointAt(0.5);
    const q = proj(G[4], mid.x, mid.y + 0.6, mid.z);
    chip(q.x, q.y - 30, 'ca. 4 Min.', 'zu Fuß', COL.blue, a1, 'center');
    const a2 = clamp((t - SCENES[4].a - 0.8) / 0.6) * P[4];
    const qa = proj(G[4], 1.6, 1.0, -1.95);
    chip(qa.x, qa.y - 20, 'Defi', '', COL.green, a2, 'center');
  }
  // 5: Prüfen – Rufen – Drücken
  if (P[5] > 0) {
    const steps = [
      ['Prüfen', 'Ansprechen, Atmung prüfen'],
      ['Rufen', '112 wählen, Defi holen lassen'],
      ['Drücken', 'Brustmitte · 5–6 cm · 100–120 / min']
    ];
    steps.forEach(([title, sub], i) => {
      const a = clamp((t - SCENES[5].a - TIMING.cprSteps[i] + 0.2) / 0.7) * P[5];
      if (a <= 0) return;
      const x = 130 + (1 - easeOut(a)) * -30, y = 190 + i * 140;
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = i === 2 ? COL.coral : COL.green;
      ctx.beginPath(); ctx.arc(x + 32, y + 32, 32, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.font = '700 32px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i + 1), x + 32, y + 33);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = COL.ink; ctx.font = '700 44px Inter'; ctx.fillText(title, x + 92, y + 30);
      ctx.fillStyle = COL.muted; ctx.font = '400 30px Inter'; ctx.fillText(sub, x + 92, y + 72);
      ctx.restore();
    });
  }
}

function composite(t, P, showProgress) {
  drawBackground();
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  ctx.fillStyle = scrim; ctx.fillRect(0, H - 430, W, 430);
  drawOverlay(t, P);
  SCENES.forEach((s, i) => drawCaption(s, P[i]));
  if (showProgress) {
    ctx.fillStyle = 'rgba(30,43,51,0.08)'; ctx.fillRect(0, H - 8, W, 8);
    ctx.fillStyle = COL.green; ctx.fillRect(0, H - 8, W * clamp(t / DUR), 8);
  }
}

function renderFrame(t, clock, showProgress) {
  const P = update(t, clock);
  renderer.render(scene, camera);
  composite(t, P, showProgress);
}

// ---------- Musik (Web Audio, ruhige Flächen) ----------
let actx = null, recDest = null, master = null, nodes = [], muted = false, voiceBuf = null;
async function ensureAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    recDest = actx.createMediaStreamDestination();
  }
  await actx.resume();
  if (!voiceBuf) {
    const bin = atob(TIMING.voice), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    try { voiceBuf = await actx.decodeAudioData(bytes.buffer); } catch (e) { console.warn('Sprecherspur konnte nicht geladen werden', e); }
  }
}
function stopAudio() {
  nodes.forEach(n => { try { n.stop(); } catch (e) {} });
  nodes = [];
  if (master) { try { master.disconnect(); } catch (e) {} master = null; }
}
function scheduleAudio(t0) {
  stopAudio();
  master = actx.createGain();
  master.gain.setValueAtTime(muted ? 0 : 0.85, t0);
  if (!muted) { master.gain.setValueAtTime(0.85, t0 + DUR - 1.5); master.gain.linearRampToValueAtTime(0, t0 + DUR); }
  master.connect(actx.destination); master.connect(recDest);

  // Musik läuft über einen eigenen Bus, der unter der Stimme leiser wird
  const music = actx.createGain(); music.gain.setValueAtTime(1, t0); music.connect(master);
  TIMING.speech.forEach(([s, e]) => {
    music.gain.setTargetAtTime(0.38, t0 + s - 0.35, 0.15);
    music.gain.setTargetAtTime(1, t0 + e + 0.25, 0.45);
  });
  if (voiceBuf) {
    const src = actx.createBufferSource(), vg = actx.createGain();
    src.buffer = voiceBuf; vg.gain.value = 1.0;
    src.connect(vg); vg.connect(master); src.start(t0); nodes.push(src);
  }
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300; lp.Q.value = 0.3;
  const delay = actx.createDelay(); delay.delayTime.value = 0.42;
  const fb = actx.createGain(); fb.gain.value = 0.38;
  const wet = actx.createGain(); wet.gain.value = 0.32;
  lp.connect(music); lp.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(music);

  const voice = (f, st, en, g) => {
    const gn = actx.createGain();
    gn.gain.setValueAtTime(0, st); gn.gain.linearRampToValueAtTime(g, st + 2.0);
    gn.gain.setValueAtTime(g, en - 2.5); gn.gain.linearRampToValueAtTime(0, en);
    gn.connect(lp);
    [['sine', 1], ['triangle', 1.003]].forEach(([type, det]) => {
      const o = actx.createOscillator(); o.type = type; o.frequency.value = f * det;
      o.connect(gn); o.start(st); o.stop(en + 0.1); nodes.push(o);
    });
  };
  // Fmaj7 – Cmaj7 – Am7 – Dm7
  const chords = [[174.61, 220.0, 261.63, 329.63], [130.81, 196.0, 246.94, 329.63], [220.0, 261.63, 329.63, 392.0], [146.83, 174.61, 220.0, 261.63]];
  const len = 7;
  for (let i = 0; i * len < DUR; i++) {
    const ch = chords[i % 4], st = t0 + i * len, en = Math.min(st + len + 2.5, t0 + DUR + 1);
    ch.forEach(f => voice(f, st, en, 0.03));
    voice(ch[0] / 2, st, en, 0.045);
  }
  // sanfter Takt in der Wiederbelebungs-Szene (110 / min)
  const s5 = SCENES[5];
  for (let tt = s5.a + 0.6; tt < s5.b - 0.8; tt += BEAT) {
    const st = t0 + tt, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = 520;
    g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(0.035, st + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 0.16);
    o.connect(g); g.connect(music); o.start(st); o.stop(st + 0.2); nodes.push(o);
  }
}

// ---------- Steuerung ----------
const bigPlay = document.getElementById('bigPlay');
const playBtn = document.getElementById('play');
const muteBtn = document.getElementById('mute');
const recBtn = document.getElementById('rec');
const hint = document.getElementById('hint');

let playing = false, startTime = 0, recorder = null, chunks = [];
const clock0 = performance.now();

async function start(record = false) {
  await ensureAudio();
  await document.fonts.ready;
  const t0 = actx.currentTime + 0.08;
  scheduleAudio(t0);
  startTime = performance.now() + 80;
  playing = true;
  bigPlay.hidden = true;
  playBtn.textContent = '↻ Neu starten';
  if (record) startRecording();
}

function finish() {
  playing = false;
  bigPlay.hidden = false;
  playBtn.textContent = '▶ Nochmal';
  if (recorder && recorder.state === 'recording') recorder.stop();
}

function startRecording() {
  if (!window.MediaRecorder || !out.captureStream) { hint.textContent = 'Aufnahme wird von diesem Browser nicht unterstützt.'; return; }
  const stream = new MediaStream([...out.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const type = ['video/mp4;codecs=avc1,mp4a', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
  recorder = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 8e6 } : {});
  chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const mime = recorder.mimeType || 'video/webm';
    const blob = new Blob(chunks, { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'defi-finder-tutorial.' + (mime.includes('mp4') ? 'mp4' : 'webm');
    a.click();
    hint.textContent = 'Video gespeichert.';
    recBtn.disabled = false;
  };
  recorder.start(250);
  recBtn.disabled = true;
  hint.textContent = 'Aufnahme läuft – Tab bitte geöffnet lassen.';
}

bigPlay.onclick = () => start();
playBtn.onclick = () => start();
recBtn.onclick = () => start(true);
muteBtn.onclick = () => {
  muted = !muted;
  muteBtn.textContent = muted ? 'Ton: aus' : 'Ton: an';
  if (master && actx) master.gain.setTargetAtTime(muted ? 0 : 0.85, actx.currentTime, 0.1);
};

// ---------- Loop ----------
const params = new URLSearchParams(location.search);
if (params.has('t')) {
  // Standbild für einen bestimmten Zeitpunkt, z. B. ?t=18
  bigPlay.hidden = true;
  const tt = parseFloat(params.get('t'));
  document.fonts.ready.then(() => { renderFrame(tt, tt, false); document.title = 'ready'; });
} else {
  (function loop() {
    const clock = (performance.now() - clock0) / 1000;
    if (playing) {
      const t = (performance.now() - startTime) / 1000;
      if (t >= DUR) { renderFrame(DUR, clock, false); finish(); }
      else renderFrame(Math.max(0, t), clock, true);
    } else {
      renderFrame(2.4, clock, false);
    }
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
